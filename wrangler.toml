name = "llm-arena"
compatibility_date = "2024-01-01"
# Worker script that handles the /model proxy route; all other routes fall through to assets.
main = "src/worker.ts"

[assets]
directory = "./dist"
# Binding name used in worker.ts to serve static files for non-/model routes.
binding = "ASSETS"

# Staging environment: identical config, different worker name.
# Deploy with: npm run build && wrangler deploy --env staging
# Lives at: llm-arena-staging.<account>.workers.dev
[env.staging]
name = "llm-arena-staging"
