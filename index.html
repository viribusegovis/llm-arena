<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Arena</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Consolas", "Menlo", monospace;
        background: #090b0f;
        color: #c9cdd4;
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }

      /* ── Title ──────────────────────────────────────────────────────────── */
      h1 {
        color: #fff;
        font-size: 1.7rem;
        letter-spacing: 0.06em;
        margin-bottom: 0.2rem;
        /* Soft glow using the primary blue accent */
        text-shadow: 0 0 28px rgba(91, 184, 245, 0.45);
      }
      .tagline {
        color: #2e3a52;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 1.4rem;
      }

      /* ── Section headers ─────────────────────────────────────────────────── */
      h2 {
        color: #5a6478;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.75rem;
        padding-left: 0.55rem;
        border-left: 2px solid #2a3040;
      }
      .panel { margin-top: 2rem; }

      /* ── Status line ─────────────────────────────────────────────────────── */
      .status { color: #5bb8f5; font-size: 0.88rem; margin-bottom: 0.5rem; min-height: 1.2em; }

      /* ── Loading progress bar ────────────────────────────────────────────── */
      /* The bar sits between the status line and the streaming box while the
         ~500 MB model downloads on first visit. Hidden via [hidden] once done. */
      .progress-wrap {
        height: 4px;
        background: #141922;
        border-radius: 2px;
        margin-bottom: 1.5rem;
        overflow: hidden;
      }
      .progress-wrap[hidden] { display: none; }
      .progress-fill {
        height: 100%;
        /* Animated shimmer — gives visual feedback even when progress is slow */
        background: linear-gradient(90deg, #2563d4 0%, #5bb8f5 50%, #6ee77a 100%);
        background-size: 200% 100%;
        animation: progress-shimmer 1.6s linear infinite;
        transition: width 0.5s ease;
        border-radius: 2px;
      }
      @keyframes progress-shimmer {
        0%   { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }

      /* ── Streaming box ───────────────────────────────────────────────────── */
      /* Shows the model "typing" its move token by token. The left border and
         agent label both react to --agent-color, which render.ts sets per-agent. */
      .stream-box {
        background: #0e1420;
        border: 1px solid #1e2838;
        border-left: 3px solid var(--agent-color, #2a3040);
        border-radius: 5px;
        padding: 0.6rem 1rem;
        min-height: 2.4rem;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
        transition: border-left-color 0.3s ease;
      }
      .stream-agent {
        /* Inherits --agent-color from the parent .stream-box */
        color: var(--agent-color, #8892a4);
        font-weight: bold;
        transition: color 0.3s ease;
      }
      .stream-arrow { color: #2e3a52; }
      .stream-output { color: #6ee77a; }
      /* Blinking block cursor appended after the streamed text */
      .stream-output::after {
        content: "▌";
        animation: blink 0.8s step-end infinite;
        color: #6ee77a;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* ── Score bars ──────────────────────────────────────────────────────── */
      .bar-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }
      .bar-label {
        width: 190px;
        text-align: right;
        font-size: 0.82rem;
        color: #8892a4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }
      .bar-track {
        flex: 1;
        background: #141922;
        border-radius: 3px;
        height: 14px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        /* --agent-color and width are set inline by render.ts per agent */
        background: linear-gradient(90deg, transparent 0%, var(--agent-color, #5bb8f5) 100%);
        transition: width 0.45s ease;
        min-width: 3px;
        border-radius: 3px;
      }
      .bar-score {
        width: 44px;
        text-align: right;
        font-size: 0.84rem;
        font-weight: bold;
        flex-shrink: 0;
        /* color set inline by render.ts */
      }

      /* ── Head-to-head heatmap ────────────────────────────────────────────── */
      /* Row headers are colored by the row agent's accent (set inline).
         Cell backgrounds are heat-coded with rgba() also set inline by render.ts. */
      .heatmap-table {
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      .heatmap-table th {
        padding: 5px 12px;
        color: #4a5568;
        font-weight: normal;
        text-align: center;
      }
      .heatmap-row-header {
        text-align: right !important;
        padding-right: 14px !important;
        /* color set inline per row by render.ts */
      }
      .heatmap-table td {
        padding: 5px 18px;
        text-align: center;
        border: 1px solid #0e1420;
        /* background-color set inline per cell by render.ts */
      }
      .heatmap-self { color: #1e2838; background: #0b0e16 !important; }
      .heatmap-cell { color: #fff; }
      .heatmap-tactic { font-size: 0.62rem; color: #3a4050; font-weight: normal; }
      .bar-label-tactic { font-size: 0.72rem; color: #3a4050; }
      .dim { color: #2e3a52; font-style: italic; font-size: 0.82rem; }

      /* ── Explainer section ───────────────────────────────────────────────── */
      .explainer-body { color: #6b7a94; font-size: 0.82rem; line-height: 1.7; }
      .explainer-p { margin-bottom: 0.75rem; }
      .explainer-subhead {
        color: #8892a4;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 1.1rem 0 0.4rem;
      }
      .explainer-matrix {
        background: #070910;
        border: 1px solid #141922;
        border-radius: 4px;
        padding: 0.6rem 1rem;
        font-size: 0.75rem;
        color: #5a6a84;
        margin-bottom: 0.75rem;
        white-space: pre;
        overflow-x: auto;
      }
      .explainer-agents {
        list-style: none;
        margin-bottom: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .agent-chip { font-weight: bold; }
      .agent-personality-tag { color: #3a4050; font-size: 0.78rem; }
      .explainer-link { color: #5bb8f5; text-decoration: none; }
      .explainer-link:hover { text-decoration: underline; }

      /* ── Mafia player grid ──────────────────────────────────────────────── */
      .player-grid { display: flex; flex-direction: column; gap: 0.4rem; }
      .player-row {
        display: flex; flex-direction: column;
        padding: 0.45rem 0.8rem; background: #0e1420; border-radius: 4px;
        border-left: 3px solid var(--agent-color, #2a3040);
        transition: opacity 0.5s;
      }
      .player-row.eliminated { opacity: 0.4; }
      .player-row-main { display: flex; align-items: center; gap: 0.7rem; }
      .player-dot { font-size: 0.7rem; flex-shrink: 0; }
      .player-dot.alive { color: #6ee77a; }
      .player-dot.dead  { color: #3a4050; }
      .player-name { font-weight: bold; font-size: 0.88rem; color: var(--agent-color, #8892a4); }
      /* Dim personality tag shown after the name: "Alice (paranoid)" */
      .player-personality { font-size: 0.72rem; color: #3a4050; margin-left: 0.25rem; flex: 1; }
      /* Inline quote: hidden when empty, streams in during day-discuss */
      .player-quote { display: none; font-style: italic; font-size: 0.76rem; color: var(--agent-color, #8892a4); opacity: 0.75; padding-top: 0.2rem; padding-left: 1.3rem; line-height: 1.45; }
      .player-quote:not(:empty) { display: block; }
      /* Blinking cursor on the active speaker's quote */
      .player-quote.streaming::after { content: "▌"; animation: blink 0.8s step-end infinite; font-style: normal; }
      .player-badge {
        font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
        padding: 0.15rem 0.45rem; border-radius: 2px; flex-shrink: 0;
      }
      .role-hidden    { background: #141922; color: #2e3a52; }
      .role-mafioso   { background: #2d0f0f; color: #f55b5b; }
      .role-detective { background: #0d1f2e; color: #5bb8f5; }
      .role-medic     { background: #2a2218; color: #f5c842; }
      .role-villager  { background: #0c1f16; color: #6ee77a; }
      .elim-cause { font-size: 0.68rem; color: #3a4050; }

      /* ── Game-over banner ────────────────────────────────────────────────── */
      .win-banner {
        margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 4px;
        font-size: 0.9rem; font-weight: bold; text-align: center; letter-spacing: 0.06em;
      }
      .win-mafia     { background: #2d0f0f; color: #f55b5b; border: 1px solid #5a1a1a; }
      .win-villagers { background: #0c1f16; color: #6ee77a; border: 1px solid #1a5a2a; }

      /* ── Tab switcher ───────────────────────────────────────────────────── */
      .tab-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
      .tab-btn {
        font-family: inherit; font-size: 0.75rem; text-transform: uppercase;
        letter-spacing: 0.1em; padding: 0.35rem 0.9rem; border-radius: 3px;
        border: 1px solid #2a3040; background: transparent; color: #4a5568;
        cursor: pointer; transition: all 0.2s;
      }
      .tab-btn.active { background: #1e2838; color: #5bb8f5; border-color: #5bb8f5; }
      .tab-btn:hover:not(.active) { border-color: #3a4050; color: #8892a4; }
      .game-controls { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; }
      .game-state {
        font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
        font-weight: bold; padding: 0.25rem 0.6rem; border-radius: 3px;
        white-space: nowrap;
      }
      .game-state[hidden] { display: none; }
      .game-state-paused   { color: #f5c842; background: rgba(245,200,66,0.08); border: 1px solid rgba(245,200,66,0.3); }
      .game-state-stopped  { color: #f55b5b; background: rgba(245,91,91,0.08);  border: 1px solid rgba(245,91,91,0.3);  }
      .game-state-finished { color: #6ee77a; background: rgba(110,231,122,0.08); border: 1px solid rgba(110,231,122,0.3); }
      .ctrl-btn {
        font-family: inherit; font-size: 0.75rem; text-transform: uppercase;
        letter-spacing: 0.1em; padding: 0.35rem 0.9rem; border-radius: 3px;
        border: 1px solid #2a3040; background: transparent; color: #4a5568;
        cursor: pointer; transition: all 0.2s;
      }
      .ctrl-btn:hover { border-color: #6ee77a; color: #6ee77a; }
      .ctrl-btn-stop:hover { border-color: #f55b5b; color: #f55b5b; }
      .ctrl-btn[hidden] { display: none; }

      /* ── Play-as-mafioso toggle ─────────────────────────────────────────── */
      .play-toggle {
        display: flex; align-items: center; gap: 0.55rem; margin-bottom: 1rem;
        font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
      }
      /* Custom toggle switch built on a hidden checkbox */
      .play-toggle-input {
        appearance: none; -webkit-appearance: none;
        width: 30px; height: 17px; border-radius: 9px;
        background: #141922; border: 1px solid #2a3040;
        position: relative; cursor: pointer; flex-shrink: 0;
        transition: background 0.2s, border-color 0.2s;
      }
      .play-toggle-input::after {
        content: ""; position: absolute;
        width: 11px; height: 11px; border-radius: 50%;
        background: #4a5568; top: 2px; left: 2px;
        transition: left 0.2s, background 0.2s;
      }
      .play-toggle-input:checked { background: #2d0f0f; border-color: #5a1a1a; }
      .play-toggle-input:checked::after { left: 15px; background: #f55b5b; }
      .play-toggle-label { color: #4a5568; cursor: pointer; transition: color 0.2s; }
      .play-toggle-input:checked + .play-toggle-label { color: #f55b5b; }

      /* ── Human player input panel ────────────────────────────────────────── */
      /* Appears below the player grid when it's the human's turn to act. */
      .human-panel {
        margin-top: 0.75rem; padding: 0.75rem 1rem;
        background: #0e1420; border: 1px solid #3a1515;
        border-left: 3px solid #f55b5b; border-radius: 5px;
      }
      .human-panel[hidden] { display: none; }
      .human-panel-label {
        font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
        color: #f55b5b; margin-bottom: 0.55rem;
      }
      .human-prompt { font-size: 0.82rem; color: #8892a4; margin-bottom: 0.5rem; }
      /* Target buttons for kill / vote */
      .human-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; }
      .human-target-btn {
        font-family: inherit; font-size: 0.8rem;
        padding: 0.3rem 0.75rem; border-radius: 3px;
        border: 1px solid #3a1515; background: #1a0a0a; color: #f55b5b;
        cursor: pointer; transition: background 0.15s, border-color 0.15s;
      }
      .human-target-btn:hover { background: #2d1010; border-color: #f55b5b; }
      /* Text area for day-discuss speak */
      .human-speak-input {
        font-family: inherit; font-size: 0.82rem; display: block;
        width: 100%; background: #070910; border: 1px solid #2a3040;
        border-radius: 3px; padding: 0.4rem 0.6rem; color: #c9cdd4;
        resize: none; margin-bottom: 0.45rem;
      }
      .human-speak-input:focus { outline: none; border-color: #f55b5b; }
      .human-send-btn {
        font-family: inherit; font-size: 0.72rem; text-transform: uppercase;
        letter-spacing: 0.08em; padding: 0.3rem 0.85rem; border-radius: 3px;
        border: 1px solid #3a1515; background: #2d0f0f; color: #f55b5b;
        cursor: pointer; transition: background 0.15s;
      }
      .human-send-btn:hover { background: #3d1515; }

      /* ── Scrolling text log ──────────────────────────────────────────────── */
      .log {
        background: #070910;
        border: 1px solid #141922;
        border-radius: 4px;
        padding: 0.75rem 1rem;
        max-height: 240px;
        overflow-y: auto;
        font-size: 0.75rem;
        color: #4a5568;
        white-space: pre-wrap;
        word-break: break-all;
        line-height: 1.5;
      }

      /* ── Leaderboard ─────────────────────────────────────────────────────── */
      .lb-toolbar { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }
      .lb-reset-btn {
        font-family: inherit; font-size: 0.72rem; text-transform: uppercase;
        letter-spacing: 0.08em; padding: 0.3rem 0.85rem; border-radius: 3px;
        border: 1px solid #3a4050; background: transparent; color: #4a5568;
        cursor: pointer; transition: all 0.2s;
      }
      .lb-reset-btn:hover { border-color: #f55b5b; color: #f55b5b; }
      .lb-hint { font-size: 0.75rem; color: #4a5568; font-style: italic; margin-bottom: 0.75rem; }
      .lb-table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
      .lb-th {
        padding: 6px 12px; color: #4a5568; font-weight: normal;
        text-align: right; border-bottom: 1px solid #141922;
      }
      .lb-th-name { text-align: left; }
      .lb-td {
        padding: 6px 12px; color: #8892a4;
        text-align: right; border-bottom: 1px solid #0e1420;
      }
      .lb-td-name { text-align: left; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
